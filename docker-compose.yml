services:
  api:
    image: ghcr.io/zaralx/zaralx-assets:latest
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      PUBLIC_URL: ${PUBLIC_URL:-https://assets.zaralx.ru/api}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - assets_data:/data
    networks:
      - zassets
    depends_on:
      - redis

  # Builds all versions on first start, about a minute each
  worker:
    image: ghcr.io/zaralx/zaralx-assets:latest
    restart: unless-stopped
    command: ["node", "dist/pipeline/cli.js", "watch"]
    environment:
      PIPELINE_MIN_VERSION: ${PIPELINE_MIN_VERSION:-1.21.4}
      PIPELINE_TYPES: ${PIPELINE_TYPES:-release}
      PIPELINE_INTERVAL_MINUTES: ${PIPELINE_INTERVAL_MINUTES:-60}
    volumes:
      - assets_data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - zassets

networks:
  zassets:
    driver: bridge

volumes:
  assets_data:
  redis_data:
